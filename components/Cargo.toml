[workspace]
resolver = "2"
members = [
    "router",
    "tenants/app-a",
    "tenants/app-b",
    "tenants/app-c",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
wit-bindgen = "0.60"
wstd = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1
